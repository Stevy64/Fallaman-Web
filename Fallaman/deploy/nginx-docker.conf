# nginx — reverse-proxy Docker (réseau interne fallaman-net)
# Termine le HTTP vers Gunicorn. Le TLS est géré par Certbot sur l'hôte
# (recommandé) ou un load-balancer OVH devant ce conteneur.
#
# health : GET /health/ doit répondre 200 (utilisé par Compose + Actions).

upstream fallaman_web {
    server web:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 12m;

    # Let's Encrypt HTTP-01 si Certbot pointe vers ce conteneur.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location /static/ {
        alias /var/www/static/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /var/www/media/;
        access_log off;
        expires 1d;
        add_header Cache-Control "public";
    }

    location /health/ {
        proxy_pass http://fallaman_web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location / {
        proxy_pass http://fallaman_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_redirect off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
